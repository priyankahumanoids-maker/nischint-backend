; ── Phase 1: Process isolation — scheduler runs in its own process ──
;
; This file activates the API/Scheduler split. Drop into
; /etc/supervisor/conf.d/ and `supervisorctl reread && supervisorctl update`
; on the production host.
;
; In parallel, the existing `backend` program must be re-deployed with
; environment NISCHINT_ROLE=api so it stops running schedulers in-process.
; Until that happens, the scheduler runs in BOTH processes — harmless
; (APScheduler jobstore is per-process, no double-fire risk for our jobs)
; but wastes CPU. Set NISCHINT_ROLE=api on the backend ASAP after enabling
; this file.
;
; To roll back: `supervisorctl stop nischint-scheduler` and remove this
; file. The `backend` program reverts to `all` (legacy behaviour) the
; moment NISCHINT_ROLE is unset.

[program:nischint-scheduler]
command=/root/.venv/bin/python -m app.workers.scheduler_runner
directory=/app/backend
autostart=true
autorestart=true
startretries=10
environment=NISCHINT_ROLE="scheduler",PYTHONUNBUFFERED="1"
stderr_logfile=/var/log/supervisor/nischint-scheduler.err.log
stdout_logfile=/var/log/supervisor/nischint-scheduler.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
