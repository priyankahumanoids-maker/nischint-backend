[program:nginx-watcher]
; Fast-recovery watcher for /etc/nginx/conf.d/nischint-app.conf.
; Polls 1Hz; re-runs nginx-patch.sh + HUPs nginx on any drift (file
; missing, empty, or replaced with a different version). Recovery
; time on platform-side config wipes drops from ~60-120s (old
; watchdog tick) to <2s (this watcher's poll + patch + HUP).
;
; Installed by /app/deploy/nginx-patch.sh on every pod start.
command=/root/.venv/bin/python -u /app/deploy/nginx-watcher.py
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=2
stderr_logfile=/var/log/supervisor/nginx-watcher.err.log
stdout_logfile=/var/log/supervisor/nginx-watcher.out.log
stopsignal=TERM
stopwaitsecs=5
